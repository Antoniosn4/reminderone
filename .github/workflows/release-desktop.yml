# =============================================================
#  Release Desktop — Windows (Tauri + sidecar FastAPI)
#
#  Dispara ao publicar uma tag semver v* (ex: v0.1.1) ou manualmente.
#
#  Secrets obrigatórios no GitHub (Settings → Secrets → Actions):
#    TAURI_SIGNING_PRIVATE_KEY           — conteúdo da chave privada minisign
#    TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — senha da chave (vazio se não houver)
#
#  O pubkey correspondente deve estar em src-tauri/tauri.conf.json (plugins.updater.pubkey).
#  Ao fazer fork, rode localmente:
#    npx @tauri-apps/cli signer generate -w src-tauri/.signing/tauri-signing.key
#  e substitua o pubkey no JSON pela linha do arquivo .pub gerado.
#
#  Este workflow garante que o endpoint do updater aponta para o repositório atual.
# =============================================================

name: Release desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt
          Push-Location server
          python -m pytest
          Pop-Location

      - name: Patch updater endpoint
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.plugins.updater.endpoints = @(
            'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
          )
          $config | ConvertTo-Json -Depth 20 | Set-Content -Path $path -NoNewline

      - name: Build sidecar (PyInstaller)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Build Tauri + upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: "--verbose"
          tagName: v__VERSION__
          releaseName: "Reminder1 v__VERSION__"
          releaseBody: "Veja os assets abaixo: MSI, NSIS e latest.json para atualização in-app."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
